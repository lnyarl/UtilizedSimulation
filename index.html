<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utilized Simulation</title>
<style>
:root { --bg:#0f1218; --card:#171c26; --border:#2a3344; --text:#e8edf5; --muted:#9aa8bc; --accent:#5b9dff; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.wrap { max-width:720px; width:100%; }
h1 { font-size:28px; margin-bottom:8px; }
h1 span { color:var(--accent); }
.sub { color:var(--muted); margin-bottom:28px; font-size:14px; }
.cards { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:640px) { .cards { grid-template-columns:1fr; } }
a.card { display:block; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; text-decoration:none; color:inherit; transition:transform .15s ease, border-color .15s ease; }
a.card:hover { transform:translateY(-3px); border-color:var(--accent); }
a.card .icon { font-size:34px; margin-bottom:12px; }
a.card h2 { font-size:17px; margin-bottom:6px; }
a.card p { color:var(--muted); font-size:13px; line-height:1.5; }
a.card .go { display:inline-block; margin-top:14px; color:var(--accent); font-size:13px; font-weight:600; }
footer { margin-top:28px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚽ <span>Utilized</span> Simulation</h1>
  <p class="sub">효용 기반(Utility AI) 의사결정 — 학습 도구와 축구 매치 시뮬레이션</p>
  <div class="cards">
    <a class="card" href="utility-ai-playground.html">
      <div class="icon">🧪</div>
      <h2>Utility AI 실험실</h2>
      <p>반응 커브, 기대효용, 선택 전략, 관성까지 — 슬라이더로 개념을 만지며 익히는 인터랙티브 가이드</p>
      <div class="go">실험실 열기 →</div>
    </a>
    <a class="card" href="soccer-sim.html">
      <div class="icon">⚽</div>
      <h2>축구 시뮬레이션</h2>
      <p>11v11, 경기 규칙, 세트피스, 카드까지 — 팀 전술·선수 기량 파라미터로 90분을 즉시 시뮬레이션하고 리플레이</p>
      <div class="go">시뮬레이션 열기 →</div>
    </a>
  </div>
  <footer>단일 HTML · 브라우저에서 전부 실행 · GitHub Pages</footer>
</div>
</body>
</html>
